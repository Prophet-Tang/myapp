<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>健身计划</title>

  <!-- PWA / 添加到主屏幕 -->
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="健身计划">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1> 健身计划</h1>
      <p id="date-label"></p>
    </div>
    <nav class="tabs">
      <button id="tab-today" class="tab active">今日</button>
      <button id="tab-calendar" class="tab">日历</button>
    </nav>
  </header>

  <main>
    <!-- 今日打卡 -->
    <section id="view-today">
      <div id="week-overview" class="week-overview"></div>

      <div id="progress" class="progress">
        <div class="progress-row">
          <span>今日进度</span>
          <span id="progress-text">0/0</span>
        </div>
        <div class="progress-track"><div id="progress-bar"></div></div>
      </div>

      <ul id="today-list" class="list"></ul>
      <div id="rest-day" class="rest hidden">今天是休息日 </div>
    </section>

    <!-- 打卡日历 -->
    <section id="view-calendar" class="hidden">
      <div class="cal-nav">
        <button id="cal-prev">‹</button>
        <span id="cal-title"></span>
        <button id="cal-next">›</button>
        <button id="cal-today" class="cal-today-btn">今天</button>
      </div>
      <div class="cal-weekdays">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <div class="cal-legend">
        <span class="lg lg-full">练完</span>
        <span class="lg lg-partial">部分</span>
        <span class="lg lg-missed">没练</span>
        <span class="lg lg-rest">休息</span>
      </div>
      <div id="cal-detail"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
